<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="google" content="notranslate">
<title>Abrindo o WhatsApp</title>
<!-- Link rastreável (2026-10-17): /w/<codigo>?utm_... conta o clique (link_rastreio_abrir) e abre o WhatsApp da clínica
     com a mensagem pronta terminando em "(cód. XXXXXX)". O código liga o lead ao anúncio quando a mensagem chega. -->
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #E7F0FC 0%, #F4F8FE 100%); color: #0E2350; }
  main { max-width: 360px; margin: 16px; padding: 28px 24px; border-radius: 24px; background: rgba(255,255,255,.85); box-shadow: 0 20px 40px -24px rgba(23,73,170,.45); text-align: center; }
  h1 { font-size: 19px; margin: 0 0 8px; font-weight: 600; }
  p { font-size: 14px; line-height: 1.5; margin: 0 0 18px; color: #4A5A78; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 22px; border-radius: 999px; background: #25D366; color: #fff; font-weight: 600; text-decoration: none; font-size: 15px; }
  .giro { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid #CFE0FA; border-top-color: #1F5EFF; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
</style>
<script src="/config.js"></script>
</head>
<body>
<main>
  <div class="giro" id="giro"></div>
  <h1 id="titulo">Abrindo o WhatsApp...</h1>
  <p id="texto">Você vai falar com a clínica pelo WhatsApp. Se não abrir sozinho, toque no botão.</p>
  <a class="btn" id="botao" href="#" style="display:none">Abrir o WhatsApp</a>
</main>
<script>
(function () {
  var cfg = window.SALUTE_CONFIG || {};
  var partes = location.pathname.split('/').filter(Boolean);
  var codigo = (partes[0] === 'w' ? partes[1] : new URLSearchParams(location.search).get('c')) || '';
  var params = {};
  new URLSearchParams(location.search).forEach(function (v, k) { params[k] = v; });
  var falha = function (msg) {
    document.getElementById('giro').style.display = 'none';
    document.getElementById('titulo').textContent = 'Não foi possível abrir';
    document.getElementById('texto').textContent = msg;
  };
  if (!codigo || !cfg.SUPABASE_URL) { falha('Este link não é válido. Peça um novo link para a clínica.'); return; }
  var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  var limite = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
  fetch(cfg.SUPABASE_URL + '/rest/v1/rpc/link_rastreio_abrir', {
    method: 'POST', signal: ctrl ? ctrl.signal : undefined,
    headers: { 'Content-Type': 'application/json', apikey: cfg.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + cfg.SUPABASE_ANON_KEY },
    body: JSON.stringify({ p_codigo: codigo, p_parametros: params, p_referencia: document.referrer || null })
  }).then(function (r) { return r.json(); }).then(function (j) {
    clearTimeout(limite);
    if (!j || !j.ok) { falha(j && j.erro === 'sem_telefone' ? 'A clínica ainda não cadastrou o WhatsApp. Tente mais tarde.' : 'Este link não está mais ativo. Peça um novo link para a clínica.'); return; }
    var url = 'https://wa.me/' + String(j.telefone).replace(/\D/g, '') + '?text=' + encodeURIComponent(j.mensagem || '');
    var b = document.getElementById('botao'); b.href = url; b.style.display = 'inline-flex';
    location.replace(url);
  })["catch"](function () { clearTimeout(limite); falha('Sem conexão agora. Verifique a internet e abra o link de novo.'); });
})();
</script>
</body>
</html>
